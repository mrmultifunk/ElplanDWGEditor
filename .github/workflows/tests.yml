name: tests
on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Stable regression suite
        run: >-
          python -m pytest -q tests
          --ignore-glob=tests/test_qt_*.py
          --ignore=tests/test_pdf_viewport_visibility_v05953.py
          --ignore=tests/test_room_snap_isolation_v0582.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Qt import smoke test
        run: >-
          python -c "from PySide6.QtWidgets import QApplication;
          import qt_articles;
          app = QApplication.instance() or QApplication([]);
          assert hasattr(qt_articles.BomManagerDialog, '_refresh_bom_category_filter')"
        env:
          QT_QPA_PLATFORM: offscreen
