[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["elplan_core"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domænekernen må ikke importere Qt"
type = "forbidden"
source_modules = ["elplan_core"]
forbidden_modules = ["PySide6"]

[[tool.importlinter.contracts]]
name = "Win32 er isoleret i platform.printing"
type = "forbidden"
source_modules = ["elplan_core"]
forbidden_modules = ["win32api", "win32con", "win32gui", "win32print"]

[[tool.importlinter.contracts]]
name = "Lagdeling i elplan_core"
type = "layers"
layers = [
  "elplan_core.export",
  "elplan_core.bom",
  "elplan_core.clipboard | elplan_core.associations | elplan_core.pl_box",
  "elplan_core.settings | elplan_core.symbols | elplan_core.cables | elplan_core.rooms | elplan_core.cad_io",
  "elplan_core.models | elplan_core.constants",
]
