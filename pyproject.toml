[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["elplan_core"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domænekernen må ikke importere Qt"
type = "forbidden"
source_modules = ["elplan_core"]
forbidden_modules = ["PySide6"]

[[tool.importlinter.contracts]]
name = "Win32 er isoleret i platform.printing"
type = "forbidden"
source_modules = ["elplan_core"]
forbidden_modules = ["pywintypes", "win32api", "win32con", "win32gui", "win32print"]
# Laziness for these exact dependencies is checked by the architecture test.
ignore_imports = [
  "elplan_core.platform.printing -> pywintypes",
  "elplan_core.platform.printing -> win32api",
  "elplan_core.platform.printing -> win32con",
  "elplan_core.platform.printing -> win32gui",
  "elplan_core.platform.printing -> win32print",
]

[[tool.importlinter.contracts]]
name = "Lagdeling i elplan_core"
type = "layers"
layers = [
  "elplan_core.platform",
  "elplan_core.export",
  "elplan_core.bom",
  "elplan_core.symbols.clipboard",
  "elplan_core.clipboard",
  "elplan_core.pl_box",
  "elplan_core.associations",
  "elplan_core.settings | elplan_core.rooms | elplan_core.cad_io",
  "elplan_core.symbols.geometry",
  "elplan_core.symbols.registry",
  "elplan_core.cables.lengths",
  "elplan_core.cables.sections",
  "elplan_core.cables.geometry",
  "elplan_core.cables.connections | elplan_core.cables.categories",
  "elplan_core.models | elplan_core.appearance",
  "elplan_core.constants",
]
